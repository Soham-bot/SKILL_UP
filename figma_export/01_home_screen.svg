  <g id="SearchAndFilters">
    <rect x="24" y="258" width="342" height="46" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    <circle cx="46" cy="281" r="6" stroke="#505C7C" stroke-width="1.5" fill="none"/>
    <line x1="50" y1="285" x2="55" y2="290" stroke="#505C7C" stroke-width="1.5" stroke-linecap="round"/>
    <text x="64" y="286" fill="#787579" font-family="Inter, sans-serif" font-size="14">Search courses or topics...</text>

    <!-- Chips Carousel -->
    <g id="FilterChips">
      <!-- Chip 1: All (Active) -->
      <rect x="24" y="318" width="50" height="32" rx="8" fill="#2B3A67"/>
      <text x="49" y="339" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">All</text>

      <!-- Chip 2: Mobile -->
      <rect x="82" y="318" width="76" height="32" rx="8" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
      <text x="120" y="339" fill="#1C1B1F" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Mobile</text>

      <!-- Chip 3: Backend -->
      <rect x="166" y="318" width="84" height="32" rx="8" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
      <text x="208" y="339" fill="#1C1B1F" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Backend</text>

      <!-- Chip 4: Security -->
      <rect x="258" y="318" width="84" height="32" rx="8" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
      <text x="300" y="339" fill="#1C1B1F" font-family="Inter, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Security</text>
    </g>
  </g>

  <!-- Section Header -->
  <text x="24" y="380" fill="#1C1B1F" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="600">Available Certifications</text>
  <text x="340" y="380" fill="#505C7C" font-family="Inter, sans-serif" font-size="13" text-anchor="end">4 courses</text>

  <!-- Course Card 1: Flutter Fundamentals -->
  <g id="CourseCard_Flutter">
    <rect x="24" y="396" width="342" height="154" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    
    <!-- Category & Status Row -->
    <text x="44" y="424" fill="#505C7C" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MOBILE DEVELOPMENT</text>
    
    <!-- Status Chip: In Progress -->
    <rect x="254" y="410" width="92" height="24" rx="6" fill="#DDE1F5"/>
    <text x="300" y="426" fill="#2B3A67" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">In progress</text>

    <!-- Title & Desc -->
    <text x="44" y="452" fill="#1C1B1F" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Flutter Fundamentals</text>
    <text x="44" y="474" fill="#505C7C" font-family="Inter, sans-serif" font-size="13">Build multi-platform applications with widget architectures.</text>

    <!-- Bottom Meta Row -->
    <text x="44" y="520" fill="#787579" font-family="Inter, sans-serif" font-size="12">~90 min · 5 lessons</text>
    
    <!-- Difficulty Tag -->
    <rect x="180" y="506" width="70" height="20" rx="4" fill="none" stroke="#B08D57" stroke-width="1"/>
    <text x="215" y="520" fill="#B08D57" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">BEGINNER</text>

    <text x="338" y="522" fill="#2B3A67" font-family="Inter, sans-serif" font-size="16" font-weight="600">→</text>
  </g>

  <!-- Course Card 2: Python Programming -->
  <g id="CourseCard_Python">
    <rect x="24" y="562" width="342" height="154" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    <text x="44" y="590" fill="#505C7C" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">PROGRAMMING &amp; AI</text>
    
    <!-- Status Chip: Completed (Tertiary role) -->
    <rect x="250" y="576" width="96" height="24" rx="6" fill="#FCEECB"/>
    <text x="298" y="592" fill="#B08D57" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Completed</text>

    <text x="44" y="618" fill="#1C1B1F" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Python Programming</text>
    <text x="44" y="640" fill="#505C7C" font-family="Inter, sans-serif" font-size="13">Master idiomatic Python syntax, OOP, and data structures.</text>

    <text x="44" y="686" fill="#787579" font-family="Inter, sans-serif" font-size="12">~95 min · 5 lessons</text>
    <rect x="180" y="672" width="70" height="20" rx="4" fill="none" stroke="#B08D57" stroke-width="1"/>
    <text x="215" y="686" fill="#B08D57" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">BEGINNER</text>

    <text x="338" y="688" fill="#2B3A67" font-family="Inter, sans-serif" font-size="16" font-weight="600">→</text>
  </g>

  <!-- Navigation Bar (M3 Standard) -->
  <g id="NavigationBar">
    <rect x="0" y="760" width="390" height="84" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    
    <!-- Item 1: Home (Active) -->
    <rect x="45" y="770" width="50" height="30" rx="15" fill="#DDE1F5"/>
    <circle cx="70" cy="785" r="7" fill="#2B3A67"/>
    <text x="70" y="816" fill="#2B3A67" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Home</text>

    <!-- Item 2: My Learning -->
    <circle cx="195" cy="785" r="7" fill="none" stroke="#505C7C" stroke-width="1.5"/>
    <text x="195" y="816" fill="#505C7C" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">My Learning</text>

    <!-- Item 3: Profile -->
    <circle cx="320" cy="785" r="7" fill="none" stroke="#505C7C" stroke-width="1.5"/>
    <text x="320" y="816" fill="#505C7C" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Profile</text>
  </g>
</svg>
