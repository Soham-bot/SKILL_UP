<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="390" height="844" fill="#FAF8F4"/>

  <!-- Status Bar -->
  <g id="StatusBar">
    <text x="32" y="32" fill="#1C1B1F" font-family="Inter, sans-serif" font-size="14" font-weight="600">9:41</text>
    <circle cx="330" cy="28" r="3" fill="#1C1B1F"/>
    <circle cx="340" cy="28" r="3" fill="#1C1B1F"/>
    <rect x="350" y="22" width="22" height="12" rx="3" stroke="#1C1B1F" stroke-width="1.5" fill="none"/>
    <rect x="352" y="24" width="14" height="8" rx="1.5" fill="#1C1B1F"/>
  </g>

  <!-- Top App Bar -->
  <g id="AppBar">
    <text x="24" y="80" fill="#B08D57" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LEARNER DASHBOARD</text>
    <text x="24" y="112" fill="#1C1B1F" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">Hello, Alex</text>
    
    <!-- Profile Avatar Button -->
    <rect x="326" y="82" width="40" height="40" rx="20" fill="#DDE1F5"/>
    <text x="346" y="106" fill="#2B3A67" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AJ</text>
  </g>

  <!-- Continue Learning Card -->
  <g id="ContinueLearningCard">
    <rect x="24" y="132" width="342" height="110" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1"/>
    <text x="44" y="158" fill="#B08D57" font-family="Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CONTINUE LEARNING</text>
    <text x="44" y="184" fill="#2B3A67" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600">Flutter Fundamentals</text>
    
    <!-- Progress Bar -->
    <rect x="44" y="202" width="200" height="6" rx="3" fill="#DDE1F5"/>
    <rect x="44" y="202" width="120" height="6" rx="3" fill="#2B3A67"/>
    <text x="44" y="224" fill="#505C7C" font-family="Inter, sans-serif" font-size="12">3 of 5 lessons completed</text>

    <!-- Resume Action -->
    <rect x="260" y="174" width="86" height="36" rx="10" fill="#2B3A67"/>
    <text x="303" y="197" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Resume</text>
  </g>

