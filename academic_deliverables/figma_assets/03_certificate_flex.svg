<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Void Black -->
  <rect width="393" height="852" fill="#050505"/>

  <!-- Blueprint Wireframe Grid Lines -->
  <defs>
    <pattern id="grid3" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.04"/>
      <path d="M 22 24 L 26 24 M 24 22 L 24 26" fill="none" stroke="#00FF66" stroke-width="1.2" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="393" height="852" fill="url(#grid3)"/>

  <!-- Top App Bar -->
  <rect x="0" y="44" width="393" height="56" fill="#050505"/>
  <text x="16" y="77" font-family="Space Mono, monospace" font-size="14" font-weight="900" fill="#FFFFFF">// THE BIG RECEIPT</text>
  <rect x="290" y="58" width="42" height="26" fill="#141414" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="303" y="75" font-family="Space Mono, monospace" font-size="12" fill="#FFFFFF">⎘</text>
  <rect x="338" y="58" width="42" height="26" fill="#141414" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="351" y="75" font-family="Space Mono, monospace" font-size="12" fill="#00FF66">⤓</text>

  <!-- Top Hazard Tape Overlay Banner -->
  <g transform="translate(14 110)">
    <rect x="0" y="0" width="365" height="40" fill="#00FF66" stroke="#000000" stroke-width="2"/>
    <defs>
      <pattern id="stripes" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#00B344" stroke-width="8"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="365" height="40" fill="url(#stripes)"/>
    <rect x="30" y="6" width="305" height="28" fill="#000000"/>
    <text x="42" y="24" font-family="Space Mono, monospace" font-size="11" font-weight="900" fill="#00FF66">&gt;&gt;&gt; PASS_GRANTED // ABSOLUTE W // NO CAP &lt;&lt;&lt;</text>
  </g>

  <!-- Main Certificate Frame Shadow -->
  <rect x="18" y="168" width="361" height="540" fill="#00FF66"/>
  <!-- Main Certificate Frame -->
  <rect x="14" y="164" width="361" height="540" fill="#0C0C0C" stroke="#00FF66" stroke-width="3"/>

  <!-- Certificate Sub-Header -->
  <text x="26" y="194" font-family="Space Mono, monospace" font-size="9.5" font-weight="900" fill="#00FF66">SKILLUP // CERTIFICATE OF FLEX</text>
  <rect x="250" y="180" width="112" height="20" fill="#00FF66"/>
  <text x="256" y="194" font-family="Space Mono, monospace" font-size="8.5" font-weight="900" fill="#000000">VERIFIED ON-DEVICE</text>

