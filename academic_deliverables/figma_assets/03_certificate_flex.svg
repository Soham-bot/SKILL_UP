  <rect x="26" y="626" width="337" height="34" fill="#141414" stroke="#00FF66" stroke-width="1.5"/>
  <text x="45" y="647" font-family="Space Mono, monospace" font-size="9.5" font-weight="900" fill="#00FF66">STATUS: VERIFIED ON-DEVICE // NO NETWORK REQUIRED</text>

  <!-- Bottom Buttons -->
  <g transform="translate(14 730)">
    <!-- Save Receipt Button -->
    <rect x="3" y="3" width="170" height="50" fill="#000000"/>
    <rect x="0" y="0" width="170" height="50" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="2"/>
    <text x="35" y="30" font-family="Space Mono, monospace" font-size="11" font-weight="900" fill="#FFFFFF">// SAVE RECEIPT</text>

    <!-- Share Flex Button -->
    <rect x="194" y="3" width="170" height="50" fill="#FFFFFF"/>
    <rect x="191" y="0" width="170" height="50" fill="#00FF66" stroke="#000000" stroke-width="2.5"/>
    <text x="214" y="30" font-family="Space Mono, monospace" font-size="11" font-weight="900" fill="#000000">SHARE THE FLEX ⚡</text>
  </g>
</svg>
