  <text x="180" y="494" font-family="Space Mono, monospace" font-size="11.5" font-weight="900" fill="#000000">10/10 [100%] // ABSOLUTE W</text>

  <!-- QR Stamp & Hashes -->
  <!-- Simulated QR Box -->
  <rect x="26" y="530" width="70" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <!-- QR Patterns -->
  <rect x="32" y="536" width="22" height="22" fill="#000000"/>
  <rect x="36" y="540" width="14" height="14" fill="#FFFFFF"/>
  <rect x="40" y="544" width="6" height="6" fill="#000000"/>

  <rect x="68" y="536" width="22" height="22" fill="#000000"/>
  <rect x="72" y="540" width="14" height="14" fill="#FFFFFF"/>
  <rect x="76" y="544" width="6" height="6" fill="#000000"/>

  <rect x="32" y="572" width="22" height="22" fill="#000000"/>
  <rect x="36" y="576" width="14" height="14" fill="#FFFFFF"/>
  <rect x="40" y="580" width="6" height="6" fill="#000000"/>

  <rect x="62" y="565" width="10" height="10" fill="#000000"/>
  <rect x="78" y="575" width="12" height="12" fill="#000000"/>

  <!-- Serial & Timestamp Text -->
  <text x="110" y="546" font-family="Space Mono, monospace" font-size="9" font-weight="900" fill="#888888">// RECEIPT_SERIAL:</text>
  <text x="110" y="564" font-family="Space Mono, monospace" font-size="11" font-weight="900" fill="#FFFFFF">SKL-FLT-2026-9A8F</text>

  <text x="110" y="588" font-family="Space Mono, monospace" font-size="9" font-weight="900" fill="#888888">// MINTED_ON:</text>
  <text x="110" y="604" font-family="Space Mono, monospace" font-size="11" font-weight="900" fill="#00FF66">OCT 01, 2026 // ON-DEVICE</text>

