    <line x1="20" y1="0" x2="20" y2="20" stroke="#000000" stroke-width="1"/>
    <line x1="28" y1="0" x2="28" y2="20" stroke="#000000" stroke-width="4"/>
    <line x1="40" y1="0" x2="40" y2="20" stroke="#000000" stroke-width="2"/>
    <line x1="55" y1="0" x2="55" y2="20" stroke="#000000" stroke-width="5"/>
    <line x1="75" y1="0" x2="75" y2="20" stroke="#000000" stroke-width="2"/>
    <line x1="90" y1="0" x2="90" y2="20" stroke="#000000" stroke-width="4"/>
    <line x1="110" y1="0" x2="110" y2="20" stroke="#000000" stroke-width="1"/>
    <line x1="125" y1="0" x2="125" y2="20" stroke="#000000" stroke-width="6"/>
    <line x1="145" y1="0" x2="145" y2="20" stroke="#000000" stroke-width="2"/>
    <line x1="165" y1="0" x2="165" y2="20" stroke="#000000" stroke-width="3"/>
    <line x1="185" y1="0" x2="185" y2="20" stroke="#000000" stroke-width="5"/>
    <line x1="205" y1="0" x2="205" y2="20" stroke="#000000" stroke-width="2"/>
    <line x1="220" y1="0" x2="220" y2="20" stroke="#000000" stroke-width="4"/>
    <line x1="240" y1="0" x2="240" y2="20" stroke="#000000" stroke-width="1"/>
    <line x1="260" y1="0" x2="260" y2="20" stroke="#000000" stroke-width="4"/>
    <line x1="280" y1="0" x2="280" y2="20" stroke="#000000" stroke-width="3"/>
    <line x1="300" y1="0" x2="300" y2="20" stroke="#000000" stroke-width="5"/>
    <line x1="320" y1="0" x2="320" y2="20" stroke="#000000" stroke-width="2"/>
