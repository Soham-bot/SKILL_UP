  <text x="26" y="310" font-family="Space Mono, monospace" font-size="9.5" font-weight="900" fill="#888888">// CERTIFIES THAT MAIN CHARACTER:</text>
  
  <rect x="26" y="322" width="337" height="44" fill="#161616" stroke="#FFFFFF" stroke-width="2"/>
  <text x="38" y="352" font-family="Space Mono, monospace" font-size="20" font-weight="900" fill="#00FF66">SOHAM AHIRRAO ⚡</text>

  <text x="26" y="394" font-family="Space Mono, monospace" font-size="9.5" font-weight="900" fill="#888888">// HAS OFFICIALLY CONQUERED:</text>

  <rect x="26" y="406" width="337" height="44" fill="#161616" stroke="#FFFFFF" stroke-width="2"/>
  <text x="38" y="434" font-family="Space Mono, monospace" font-size="14.5" font-weight="900" fill="#FFFFFF">FLUTTER &amp; DART MASTERCLASS</text>

